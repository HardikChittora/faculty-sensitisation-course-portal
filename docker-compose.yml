version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fscp-postgres
    restart: always
    environment:
      POSTGRES_USER: fscp_admin
      POSTGRES_PASSWORD: fscp_secret_pass
      POSTGRES_DB: faculty_course_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fscp_admin -d faculty_course_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
