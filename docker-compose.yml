services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fscp_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-faculty_course_portal}
    ports:
      - "127.0.0.1:${DB_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-9501}:${PORT:-9501}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-9501}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-fscp_admin}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-faculty_course_portal}
      # Compose uses its own database even if a legacy .env contains DATABASE_URL.
      DATABASE_URL: ""

volumes:
  pgdata:
