version: '3.8'

services:
  # 1. Containerized PostgreSQL Database (no exposed port - internal only)
  postgres:
    image: postgres:16-alpine
    container_name: fscp-postgres-db
    restart: always
    environment:
      POSTGRES_USER: fscp_admin
      POSTGRES_PASSWORD: fscp_secret_pass
      POSTGRES_DB: faculty_course_portal
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fscp_admin -d faculty_course_portal"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fscp-network

  # 2. Application Server (Express API + React Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fscp-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: 5000
      # Override DATABASE_URL to point to the local postgres container
      DATABASE_URL: postgresql://fscp_admin:fscp_secret_pass@postgres:5432/faculty_course_portal
    networks:
      - fscp-network

volumes:
  pgdata:
    driver: local

networks:
  fscp-network:
    driver: bridge
